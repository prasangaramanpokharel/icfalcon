# IcFalcon ops — falcon CLI config
# Usage: falcon <command> [--local] [args...]
# Install: ./ops/install.sh

canister: app
backend_dir: backend

commands:
  # ── setup ──────────────────────────────────────────
  setup:init:
    confirm: false
    script: ops/scripts/setup-init.sh

  replica:start:
    confirm: false
    script: ops/scripts/replica-start.sh

  replica:stop:
    confirm: false
    script: ops/scripts/replica-stop.sh

  # ── backend ────────────────────────────────────────
  backend:test:
    confirm: false
    script: ops/scripts/backend-test.sh

  backend:build:
    confirm: false
    steps:
      - dfx build {{canister}} {{network}}

  backend:deploy:
    confirm: true
    steps:
      - dfx canister create {{canister}} {{network}}
      - dfx build {{canister}} {{network}}
      - dfx deploy {{canister}} --mode=upgrade --wasm-memory-persistence keep {{network}} 2>/dev/null || dfx deploy {{canister}} {{network}}

  backend:hash:
    confirm: false
    steps:
      - dfx canister info {{canister}} {{network}}

  backend:logs:
    confirm: false
    steps:
      - dfx canister logs {{canister}} {{network}}

  # ── production ship ────────────────────────────────
  prod:ship:
    confirm: true
    steps:
      - dfx canister create {{canister}} {{network}}
      - dfx build {{canister}} {{network}}
      - dfx deploy {{canister}} --mode=upgrade --wasm-memory-persistence keep {{network}} 2>/dev/null || dfx deploy {{canister}} {{network}}
      - npm run build --prefix frontend

  prod:check:
    confirm: false
    steps:
      - bash ops/scripts/validate-skills.sh
      - bash ops/scripts/code/motoko/validate-code.sh
      - dfx build {{canister}} --check {{network}}
      - npm run build --prefix frontend

  skills:validate:
    confirm: false
    script: ops/scripts/validate-skills.sh

  # ── audit ──────────────────────────────────────────
  audit:motoko:
    confirm: false
    script: ops/scripts/code/motoko/validate-code.sh

  # ── canister ───────────────────────────────────────
  canister:status:
    confirm: false
    steps:
      - dfx canister status {{canister}} {{network}}

  canister:ping:
    confirm: false
    steps:
      - dfx canister call {{canister}} ping --query {{network}}

  canister:list:
    confirm: false
    steps:
      - python3 -c 'import json, os; net = "local" if "{{network}}" == "--network local" else "ic"; p = f".dfx/{net}/canister_ids.json" if os.path.exists(f".dfx/{net}/canister_ids.json") else "canister_ids.json"; [(print(f"{k:16} {v.get(net) if isinstance(v, dict) else v}") if os.path.exists(p) else None) for k, v in (json.load(open(p)).items() if os.path.exists(p) else [])]'

  canister:id:
    confirm: false
    steps:
      - dfx canister id {{canister}} {{network}}

  canister:info:
    confirm: false
    steps:
      - dfx canister info {{canister}} {{network}}

  canister:call:
    confirm: false
    script: ops/scripts/canister-call.sh

  canister:logs:
    confirm: false
    steps:
      - dfx canister logs {{canister}} {{network}}

  canister:snapshot:create:
    confirm: false
    steps:
      - dfx canister stop {{canister}} {{network}}
      - dfx canister snapshot create {{canister}} {{network}}
      - dfx canister start {{canister}} {{network}}

  canister:snapshot:list:
    confirm: false
    steps:
      - dfx canister snapshot list {{canister}} {{network}}

  canister:snapshot:load:
    confirm: true
    script: ops/scripts/canister-snapshot-load.sh

  # ── cycles ─────────────────────────────────────────
  cycles:balance:
    confirm: false
    steps:
      - dfx canister status {{canister}} {{network}}

  cycles:address:
    confirm: false
    steps:
      - dfx ledger account-id

  # ── users ──────────────────────────────────────────
  users:count:
    confirm: false
    steps:
      - dfx canister call {{canister}} status --query {{network}}

  # ── frontend ───────────────────────────────────────
  frontend:dev:
    confirm: false
    steps:
      - npm run dev --prefix frontend

  frontend:build:
    confirm: false
    steps:
      - npm run build --prefix frontend

  frontend:production:
    confirm: false
    steps:
      - cd frontend && npx serve@latest out

  # ── scaffold (Laravel-style) ───────────────────────
  make:feature:
    confirm: false
    script: ops/make-feature.sh

  make:canister:
    confirm: false
    script: ops/make-canister.sh

  # ── packages (go get style) ────────────────────────
  pkg:add:
    confirm: false
    script: ops/pkg-add.sh

  pkg:list:
    confirm: false
    script: ops/pkg-list.sh

  pkg:installed:
    confirm: false
    script: ops/pkg-installed.sh

  pkg:push:
    confirm: false
    script: ops/pkg-push.sh

aliases:
  # setup
  s:init: setup:init
  r:start: replica:start
  r:stop: replica:stop
  # backend
  b:test: backend:test
  b:build: backend:build
  b:deploy: backend:deploy
  b:hash: backend:hash
  b:logs: backend:logs
  # production
  p:ship: prod:ship
  p:check: prod:check
  # canister
  c:status: canister:status
  c:ping: canister:ping
  c:list: canister:list
  c:id: canister:id
  c:info: canister:info
  c:call: canister:call
  c:logs: canister:logs
  c:sn:create: canister:snapshot:create
  c:sn:list: canister:snapshot:list
  c:sn:load: canister:snapshot:load
  b:snapshot: canister:snapshot:create
  # cycles
  y:bal: cycles:balance
  y:addr: cycles:address
  # users
  u:count: users:count
  # frontend
  f:dev: frontend:dev
  f:build: frontend:build
  f:production: frontend:production
  f:prod: frontend:production
  # scaffold
  m:f: make:feature
  m:feature: make:feature
  m:c: make:canister
  m:canister: make:canister
  # packages
  add:pkg: pkg:add
  a:p: pkg:add
  p:list: pkg:list
  p:ls: pkg:installed
  p:push: pkg:push
  sk:validate: skills:validate
  # audit
  a:c:m: audit:motoko
  a:m: audit:motoko
  audit:code:motoko: audit:motoko
  code:motoko: audit:motoko
