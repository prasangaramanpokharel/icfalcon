# IcFalcon ops — falcon CLI config
# Usage: falcon <command> [--local] [args...]
# Install: ./ops/install.sh

canister: app
backend_dir: backend

commands:
  # ── setup ──────────────────────────────────────────
  setup:init:
    confirm: false
    script: ops/scripts/setup-init.sh

  replica:start:
    confirm: false
    script: ops/scripts/replica-start.sh

  replica:stop:
    confirm: false
    script: ops/scripts/replica-stop.sh

  # ── backend ────────────────────────────────────────
  backend:test:
    confirm: false
    script: ops/scripts/backend-test.sh

  backend:build:
    confirm: false
    script: ops/scripts/backend-build.sh

  backend:deploy:
    confirm: true
    steps:
      - dfx canister create {{canister}} {{network}}
      - dfx build {{canister}} {{network}}
      - dfx deploy {{canister}} --mode=upgrade --wasm-memory-persistence keep {{network}} 2>/dev/null || dfx deploy {{canister}} {{network}}

  backend:hash:
    confirm: false
    steps:
      - dfx canister info {{canister}} {{network}}

  backend:logs:
    confirm: false
    steps:
      - dfx canister logs {{canister}} {{network}}

  # ── production ship ────────────────────────────────
  prod:ship:
    confirm: true
    steps:
      - dfx canister create {{canister}} {{network}}
      - dfx build {{canister}} {{network}}
      - dfx deploy {{canister}} --mode=upgrade --wasm-memory-persistence keep {{network}} 2>/dev/null || dfx deploy {{canister}} {{network}}
      - npm run build --prefix frontend

  prod:check:
    confirm: false
    steps:
      - bash ops/scripts/validate-skills.sh
      - bash ops/scripts/code/motoko/validate-code.sh
      - dfx build {{canister}} --check {{network}}
      - npm run build --prefix frontend

  skills:validate:
    confirm: false
    script: ops/scripts/validate-skills.sh

  # ── audit ──────────────────────────────────────────
  audit:motoko:
    confirm: false
    script: ops/scripts/code/motoko/validate-code.sh

  # ── canister ───────────────────────────────────────
  canister:status:
    confirm: false
    steps:
      - dfx canister status {{canister}} {{network}}

  canister:ping:
    confirm: false
    steps:
      - dfx canister call {{canister}} ping --query {{network}}

  canister:list:
    confirm: false
    steps:
      - python3 -c 'import json, os; net = "local" if "{{network}}" == "--network local" else "ic"; p = f".dfx/{net}/canister_ids.json" if os.path.exists(f".dfx/{net}/canister_ids.json") else "canister_ids.json"; [(print(f"{k:16} {v.get(net) if isinstance(v, dict) else v}") if os.path.exists(p) else None) for k, v in (json.load(open(p)).items() if os.path.exists(p) else [])]'

  canister:id:
    confirm: false
    steps:
      - dfx canister id {{canister}} {{network}}

  canister:info:
    confirm: false
    steps:
      - dfx canister info {{canister}} {{network}}

  canister:call:
    confirm: false
    script: ops/scripts/canister-call.sh

  canister:logs:
    confirm: false
    steps:
      - dfx canister logs {{canister}} {{network}}

  canister:snapshot:create:
    confirm: false
    steps:
      - dfx canister stop {{canister}} {{network}}
      - dfx canister snapshot create {{canister}} {{network}}
      - dfx canister start {{canister}} {{network}}

  canister:snapshot:list:
    confirm: false
    steps:
      - dfx canister snapshot list {{canister}} {{network}}

  canister:snapshot:load:
    confirm: true
    script: ops/scripts/canister-snapshot-load.sh

  canister:create:
    confirm: false
    script: ops/scripts/canister-manage.sh create

  canister:start:
    confirm: false
    script: ops/scripts/canister-manage.sh start

  canister:stop:
    confirm: false
    script: ops/scripts/canister-manage.sh stop

  canister:delete:
    confirm: true
    script: ops/scripts/canister-manage.sh delete

  canister:install:
    confirm: true
    script: ops/scripts/canister-manage.sh install

  canister:uninstall:
    confirm: true
    script: ops/scripts/canister-manage.sh uninstall

  canister:metadata:
    confirm: false
    script: ops/scripts/canister-manage.sh metadata

  canister:settings:
    confirm: false
    script: ops/scripts/canister-manage.sh settings

  canister:sync:
    confirm: false
    script: ops/scripts/canister-manage.sh sync

  # ── identity ─────────────────────────────────────────
  identity:whoami:
    confirm: false
    script: ops/scripts/identity-op.sh whoami

  identity:principal:
    confirm: false
    script: ops/scripts/identity-op.sh principal

  identity:address:
    confirm: false
    script: ops/scripts/identity-op.sh address

  identity:list:
    confirm: false
    script: ops/scripts/identity-op.sh list

  identity:use:
    confirm: false
    script: ops/scripts/identity-op.sh use

  identity:new:
    confirm: false
    script: ops/scripts/identity-op.sh new

  identity:export:
    confirm: false
    script: ops/scripts/identity-op.sh export

  identity:import:
    confirm: false
    script: ops/scripts/identity-op.sh import

  identity:delete:
    confirm: false
    script: ops/scripts/identity-op.sh delete

  # ── token ────────────────────────────────────────────
  token:balance:
    confirm: false
    script: ops/scripts/token-op.sh balance

  token:transfer:
    confirm: true
    script: ops/scripts/token-op.sh transfer

  token:approve:
    confirm: true
    script: ops/scripts/token-op.sh approve

  token:allowance:
    confirm: false
    script: ops/scripts/token-op.sh allowance

  # ── cycles ─────────────────────────────────────────
  cycles:balance:
    confirm: false
    script: ops/scripts/cycles-op.sh balance

  cycles:mint:
    confirm: true
    script: ops/scripts/cycles-op.sh mint

  cycles:transfer:
    confirm: true
    script: ops/scripts/cycles-op.sh transfer

  cycles:topup:
    confirm: true
    script: ops/scripts/cycles-op.sh topup

  cycles:address:
    confirm: false
    script: ops/scripts/identity-op.sh address

  # ── network ──────────────────────────────────────────
  network:list:
    confirm: false
    script: ops/scripts/network-op.sh list

  network:ping:
    confirm: false
    script: ops/scripts/network-op.sh ping

  network:status:
    confirm: false
    script: ops/scripts/network-op.sh status

  # ── project & environment ────────────────────────────
  project:show:
    confirm: false
    script: ops/scripts/project-op.sh show

  env:list:
    confirm: false
    script: ops/scripts/project-op.sh env

  completions:
    confirm: false
    script: ops/scripts/project-op.sh completions

  # ── users ──────────────────────────────────────────
  users:count:
    confirm: false
    steps:
      - dfx canister call {{canister}} status --query {{network}}

  # ── frontend ───────────────────────────────────────
  frontend:dev:
    confirm: false
    steps:
      - npm run dev --prefix frontend

  frontend:build:
    confirm: false
    steps:
      - npm run build --prefix frontend

  frontend:production:
    confirm: false
    steps:
      - cd frontend && npx serve@latest out

  # ── scaffold (Laravel-style) ───────────────────────
  make:feature:
    confirm: false
    script: ops/make-feature.sh

  make:canister:
    confirm: false
    script: ops/make-canister.sh

  # ── packages (go get style) ────────────────────────
  pkg:add:
    confirm: false
    script: ops/pkg-add.sh

  pkg:list:
    confirm: false
    script: ops/pkg-list.sh

  pkg:installed:
    confirm: false
    script: ops/pkg-installed.sh

  pkg:push:
    confirm: false
    script: ops/pkg-push.sh

aliases:
  # setup
  s:init: setup:init
  r:start: replica:start
  r:stop: replica:stop
  # backend
  b:test: backend:test
  b:build: backend:build
  b:deploy: backend:deploy
  b:hash: backend:hash
  b:logs: backend:logs
  # production
  p:ship: prod:ship
  p:check: prod:check
  # canister
  c:status: canister:status
  c:ping: canister:ping
  c:list: canister:list
  c:id: canister:id
  c:info: canister:info
  c:call: canister:call
  c:logs: canister:logs
  c:create: canister:create
  c:start: canister:start
  c:stop: canister:stop
  c:delete: canister:delete
  c:del: canister:delete
  c:install: canister:install
  c:uninstall: canister:uninstall
  c:metadata: canister:metadata
  c:meta: canister:metadata
  c:settings: canister:settings
  c:sync: canister:sync
  c:topup: cycles:topup
  c:sn:create: canister:snapshot:create
  c:sn:list: canister:snapshot:list
  c:sn:load: canister:snapshot:load
  b:snapshot: canister:snapshot:create
  # identity
  whoami: identity:whoami
  id:whoami: identity:whoami
  id:principal: identity:principal
  id:p: identity:principal
  id:addr: identity:address
  id:address: identity:address
  id:list: identity:list
  id:ls: identity:list
  id:use: identity:use
  id:new: identity:new
  id:export: identity:export
  id:import: identity:import
  id:delete: identity:delete
  id:rm: identity:delete
  # token
  t:bal: token:balance
  t:balance: token:balance
  t:send: token:transfer
  t:transfer: token:transfer
  t:approve: token:approve
  t:allowance: token:allowance
  # cycles
  y:bal: cycles:balance
  y:addr: cycles:address
  y:mint: cycles:mint
  y:transfer: cycles:transfer
  y:send: cycles:transfer
  y:topup: cycles:topup
  # network
  net:list: network:list
  net:ls: network:list
  net:ping: network:ping
  net:status: network:status
  r:ping: network:ping
  r:status: network:status
  # project & env
  prj:show: project:show
  p:show: project:show
  env:ls: env:list
  env:list: env:list
  # users
  u:count: users:count
  # frontend
  f:dev: frontend:dev
  f:build: frontend:build
  f:production: frontend:production
  f:prod: frontend:production
  # scaffold
  m:f: make:feature
  m:feature: make:feature
  m:c: make:canister
  m:canister: make:canister
  # packages
  add:pkg: pkg:add
  a:p: pkg:add
  p:list: pkg:list
  p:ls: pkg:installed
  p:push: pkg:push
  sk:validate: skills:validate
  # audit
  a:c:m: audit:motoko
  a:m: audit:motoko
  audit:code:motoko: audit:motoko
  code:motoko: audit:motoko
